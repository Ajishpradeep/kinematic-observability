[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematic-observability"
version = "0.2.0"
description = "Geometric consistency and reconstruction accuracy in two-link monocular refinement"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ajish Pradeep"}]
dependencies = ["numpy>=1.24,<3", "torch>=2.4,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["black==24.8.0", "ruff==0.8.6"]

[project.scripts]
kinematic-observability = "observability.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["observability*"]

[tool.black]
target-version = ["py38"]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
