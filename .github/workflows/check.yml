name: Research checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check src tests .github
      - run: black --check src tests .github
      - run: python -m unittest discover -s tests -v
      - run: python -m observability verify
      - run: python .github/check_repository.py --history
      - run: python -m observability run --out local/smoke --synthetic-n 8 --steps 2 --smoke
      - run: python -m observability report --out local/report
      - run: diff results/tables.md local/report/tables.md
